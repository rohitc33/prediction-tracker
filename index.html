<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Predictions">
<title>Prediction Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a5bd9'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #efede7;
    --border: #e1ded6;
    --text: #1d1d1f;
    --muted: #6b6a66;
    --accent: #3a5bd9;
    --accent-ink: #ffffff;
    --good: #1f8a5b;
    --bad: #c8412f;
    --warn: #b7791f;
    --grid: #e7e4dc;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px;
    --tabbar-h: 60px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1f2024;
      --surface-2: #2a2b30;
      --border: #33343a;
      --text: #ecebe8;
      --muted: #9a9993;
      --accent: #7b93ff;
      --accent-ink: #0f1330;
      --good: #4cc38a;
      --bad: #ff7b6b;
      --warn: #e3b25b;
      --grid: #2d2e33;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .top-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .top h1 { font-size: 19px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }

  .icon-btn {
    border: 0; background: transparent; width: 40px; height: 40px; border-radius: 10px;
    display: inline-grid; place-items: center; cursor: pointer; color: var(--text); flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }

  .btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; font-weight: 550; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: inherit;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 6px 10px; font-size: 14px; }
  .btn.good { color: var(--good); }
  .btn.bad { color: var(--bad); }

  nav.tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: color-mix(in srgb, var(--surface) 90%, transparent);
    backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    user-select: none; -webkit-user-select: none;
  }
  .tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
  .tab {
    border: 0; background: none; cursor: pointer; text-decoration: none; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; font-weight: 600; padding: 0;
  }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--accent); }
  .add-circle {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; margin-top: -18px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
    border: 4px solid var(--bg);
  }
  .add-circle svg { width: 26px; height: 26px; }
  .tab-add:active .add-circle { transform: scale(.94); }

  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
    padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  }
  .chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .seg.full { display: flex; margin-bottom: 12px; }
  .seg.full button { flex: 1; }

  .summary { display: block; text-decoration: none; color: inherit; }
  .summary-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .summary .label { font-size: 13px; color: var(--muted); }
  .summary .big { font-size: 34px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .summary .big.low { color: var(--muted) !important; }
  .summary .counts { font-size: 13px; color: var(--muted); text-align: right; }

  .list { padding: 0; overflow: hidden; }
  .list .row {
    display: flex; width: 100%; align-items: center; gap: 12px; padding: 14px 16px; border: 0; background: none;
    border-bottom: 1px solid var(--border); text-align: left; cursor: pointer; font-size: 16px; color: var(--text);
  }
  .list .row:last-child { border-bottom: 0; }
  .list .row:active { background: var(--surface-2); }
  .list .row.danger { color: var(--bad); }
  .list .row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .list .row svg { width: 18px; height: 18px; color: var(--muted); flex: none; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
  }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 2px 10px; gap: 10px; }
  .section-title h2 { font-size: 15px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat .label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .stat .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .sub { font-size: 12.5px; color: var(--muted); }
  .stat .range { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat.low .value { color: var(--muted); }
  .counts-line { font-size: 14px; color: var(--muted); margin: 0 2px 10px; }
  .notice { font-size: 14px; color: var(--muted); padding: 12px 14px; margin-bottom: 10px; }

  .cat-list { display: grid; gap: 10px; }
  .cat-card { display: block; text-decoration: none; color: inherit; position: relative; overflow: hidden; padding-left: 20px; }
  .cat-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cat); }
  .cat-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cat-card h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
  .cat-card .counts { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
  .mini { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .mini span { color: var(--muted); }
  .mini b { font-weight: 650; color: var(--text); }
  .mini.low b { color: var(--muted); }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 550; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }

  .pred-list { display: grid; gap: 10px; }
  .pred { padding: 14px 14px 12px; }
  .pred .ptext { font-size: 16px; overflow-wrap: anywhere; cursor: pointer; }
  .pred .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
  .pred .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pred .actions .btn { flex: 1; min-width: 90px; }

  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .empty p { margin: 6px 0 16px; }

  .charts { display: grid; gap: 12px; }
  @media (min-width: 640px) { .charts { grid-template-columns: 1fr 1fr; } .charts .wide { grid-column: 1 / -1; } }
  .chart-card h4 { margin: 0; font-size: 15px; }
  .chart-card .desc { margin: 2px 0 8px; font-size: 13px; color: var(--muted); }
  .chart-card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-card .none { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }

  .calib-row { display: grid; grid-template-columns: 70px 1fr 64px; align-items: center; gap: 10px; font-size: 14px; padding: 5px 0; font-variant-numeric: tabular-nums; }
  .calib-bar { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
  .calib-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); opacity: .85; }
  .calib-bar .target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); border-radius: 1px; }
  .calib-row .n { color: var(--muted); text-align: right; font-size: 13px; }

  details.help { margin-top: 16px; }
  details.help summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.help div { font-size: 14px; color: var(--muted); }
  details.help dt { color: var(--text); font-weight: 650; margin-top: 10px; }
  details.help dd { margin: 2px 0 0; }

  dialog {
    border: 0; padding: 0; background: var(--surface); color: var(--text);
    width: min(560px, 100vw); max-height: 92vh; border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  @media (max-width: 600px) {
    dialog { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 18px 18px 0 0; max-height: 94vh; }
  }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .dlg-head h3 { margin: 0; font-size: 18px; }
  .dlg-body { padding: 8px 16px 16px; display: grid; gap: 14px; }
  .dlg-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .dlg-foot .spacer { flex: 1; }
  .field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
  .field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 10px;
    padding: 10px 12px; font-size: 16px; font-weight: 400;
  }
  textarea { resize: vertical; min-height: 64px; }
  .locked-val { font-weight: 400; font-size: 16px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; overflow-wrap: anywhere; white-space: pre-wrap; }
  .lock-note { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .conf-display { display: flex; align-items: baseline; justify-content: space-between; }
  .conf-display .big { font-size: 30px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .conf-display .word { font-size: 13px; color: var(--muted); font-weight: 500; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 4px 9px; font-size: 13.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .quick button:hover { background: var(--surface-2); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--sw); cursor: pointer; }
  .swatches button.on { border-color: var(--text); }
  .outcome-choice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .outcome-choice button { border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 8px 4px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .outcome-choice button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  .menu { display: grid; gap: 8px; }
  .menu .btn { justify-content: flex-start; width: 100%; }
  .muted { color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100vw - 32px);
    display: flex; gap: 14px; align-items: center;
  }
  .toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }
  @media (prefers-color-scheme: dark) { .toast button { color: #3a5bd9; } }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top"><div class="top-inner" id="topbar"></div></header>
<main id="app"></main>
<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <a class="tab" data-tab="home" href="#/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg><span>Home</span></a>
    <a class="tab" data-tab="predictions" href="#/predictions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Predictions</span></a>
    <button class="tab tab-add" type="button" data-act="add" aria-label="New prediction">
      <span class="add-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <a class="tab" data-tab="scores" href="#/scores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Scores</span></a>
    <a class="tab" data-tab="more" href="#/more">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span>More</span></a>
  </div>
</nav>
<dialog id="dlg"></dialog>
<input type="file" id="import-file" accept="application/json,.json" class="sr">

<script>
(() => {
'use strict';

/* ---------- Storage ---------- */
const KEY = 'prediction-tracker.v1';
const COLORS = ['#3a5bd9', '#1f8a5b', '#c8412f', '#b7791f', '#8a46c4', '#0f8f9e', '#d14f8f', '#5b6b7d'];

function blank() { return { version: 1, categories: [], predictions: [] }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.categories) && Array.isArray(s.predictions)) return s;
  } catch (e) { /* fall through */ }
  return blank();
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save to local storage: ' + e.message); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isoOf = ms => { const d = new Date(ms); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const todayISO = () => isoOf(Date.now());
const dayMs = iso => new Date(iso + 'T12:00:00').getTime();
const fmtDate = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const fmtShort = ms => new Date(ms).toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const catById = id => state.categories.find(c => c.id === id);
const predsIn = catId => catId ? state.predictions.filter(p => p.categoryId === catId) : state.predictions;
const isScored = p => p.outcome === 'true' || p.outcome === 'false';
const isOpen = p => !p.outcome;

// Statement, probability and "made on" date can be fixed for a few minutes after entry, then lock.
const LOCK_MIN = 15;
const lockLeftMs = p => p.ts ? LOCK_MIN * 6e4 - (Date.now() - p.ts) : 0;
const isLocked = p => lockLeftMs(p) <= 0;

function confWord(c) {
  const d = Math.max(c, 100 - c);
  if (c === 50) return 'coin flip';
  const dir = c > 50 ? 'likely' : 'unlikely';
  if (d >= 97) return c > 50 ? 'near certain' : 'near impossible';
  if (d >= 85) return 'very ' + dir;
  if (d >= 65) return dir;
  return 'slightly ' + dir;
}

/* ---------- Metrics ----------
   Each prediction has a probability f = confidence / 100 that it comes true and, once resolved,
   an outcome o (1 = happened, 0 = didn't). Only happened/didn't predictions are scored.

   Brier        = mean (f − o)². 0 is perfect.
   Uncertainty  = ō (1 − ō), where ō is how often things happened. Depends only on the outcomes.
   Skill        = 1 − Brier / Uncertainty: improvement over always forecasting the base rate ō.
   Murphy decomposition (forecasts binned in tenths, sparse neighbours merged):
                  Brier ≈ Reliability − Resolution + Uncertainty
     Reliability = Σ n_k (f̄_k − ō_k)² / N  → shown as calibration error √Reliability, in points.
     Resolution  = Σ n_k (ō_k − ō)² / N    → shown as a share of Uncertainty (0–100%).
   Direction bias = mean f − ō: positive means things happen less often than you predict.
   Overconfidence = mean confidence in the side you picked − how often that side was right.
*/
const MIN_N = 20;  // below this many scored predictions, numbers are flagged as noisy
const SHOW_N = 5;  // below this, no scores are shown
const BINS = 10;
const MIN_BIN = 5; // bins with a single prediction would make resolution look perfect, so merge small ones

function score(scored) {
  const N = scored.length;
  if (N < SHOW_N) return null;
  const f = scored.map(p => p.confidence / 100), o = scored.map(p => p.outcome === 'true' ? 1 : 0);
  const obar = mean(o), unc = obar * (1 - obar);
  const brier = mean(f.map((x, i) => (x - o[i]) ** 2));
  const bins = Array.from({ length: BINS }, () => ({ n: 0, f: 0, o: 0 }));
  f.forEach((x, i) => { const b = bins[Math.min(BINS - 1, Math.floor(x * BINS))]; b.n++; b.f += x; b.o += o[i]; });
  // Merge adjacent tenths left to right until each group has MIN_BIN predictions; a short tail joins the last group.
  const groups = [];
  let cur = { n: 0, f: 0, o: 0 };
  bins.forEach(b => {
    cur.n += b.n; cur.f += b.f; cur.o += b.o;
    if (cur.n >= MIN_BIN) { groups.push(cur); cur = { n: 0, f: 0, o: 0 }; }
  });
  if (cur.n) {
    const last = groups[groups.length - 1];
    if (last) { last.n += cur.n; last.f += cur.f; last.o += cur.o; } else groups.push(cur);
  }
  let rel = 0, res = 0;
  groups.forEach(b => {
    if (!b.n) return;
    rel += b.n * (b.f / b.n - b.o / b.n) ** 2;
    res += b.n * (b.o / b.n - obar) ** 2;
  });
  rel /= N; res /= N;
  const dirn = scored.filter(p => p.confidence !== 50);
  const hits = dirn.map(p => (p.confidence > 50) === (p.outcome === 'true') ? 1 : 0);
  return {
    n: N,
    brier,
    skill: unc > 0 ? (1 - brier / unc) * 100 : null,
    calErr: Math.sqrt(rel) * 100,
    // One group can't separate anything, so resolution is undefined rather than 0.
    resolution: unc > 0 && groups.length > 1 ? res / unc * 100 : null,
    baseRate: obar * 100,
    dirBias: (mean(f) - obar) * 100,
    overconf: dirn.length ? mean(dirn.map(p => Math.max(p.confidence, 100 - p.confidence))) - mean(hits) * 100 : null,
    hitRate: dirn.length ? mean(hits) * 100 : null,
  };
}

// 90% bootstrap intervals. Seeded so the numbers don't jitter between renders.
const RANGE_KEYS = ['skill', 'calErr', 'resolution', 'dirBias'];
function seededRandom(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function ranges(scored, B = 400) {
  const N = scored.length, rand = seededRandom(N * 7919 + 1);
  const samples = Object.fromEntries(RANGE_KEYS.map(k => [k, []]));
  for (let b = 0; b < B; b++) {
    const s = score(Array.from({ length: N }, () => scored[Math.floor(rand() * N)]));
    if (s) RANGE_KEYS.forEach(k => { if (s[k] != null) samples[k].push(s[k]); });
  }
  return Object.fromEntries(RANGE_KEYS.map(k => {
    const a = samples[k].sort((x, y) => x - y);
    return [k, a.length >= B / 2 ? [a[Math.floor(a.length * 0.05)], a[Math.ceil(a.length * 0.95) - 1]] : null];
  }));
}

// Scores after each resolution, by date resolved. mode: 'cum' (everything so far) or a rolling window size.
function series(preds, mode) {
  const byResolved = preds.filter(isScored)
    .sort((a, b) => (a.resolvedAt || '').localeCompare(b.resolvedAt || '') || a.ts - b.ts);
  const out = [];
  byResolved.forEach((p, i) => {
    const s = score(mode === 'cum' ? byResolved.slice(0, i + 1) : byResolved.slice(Math.max(0, i + 1 - mode), i + 1));
    if (s) out.push({ t: dayMs(p.resolvedAt || p.createdAt), s, low: s.n < MIN_N, p });
  });
  return out;
}

// Folded by the side you picked, so 30% "yes" counts as 70% "no".
function calibration(preds) {
  const buckets = [[50, 59], [60, 69], [70, 79], [80, 89], [90, 99]].map(([lo, hi]) => ({ lo, hi, items: [] }));
  preds.filter(p => isScored(p) && p.confidence !== 50).forEach(p => {
    const c = Math.max(p.confidence, 100 - p.confidence);
    const b = buckets.find(b => c >= b.lo && c <= b.hi);
    if (b) b.items.push({ c, hit: (p.confidence > 50) === (p.outcome === 'true') });
  });
  return buckets.map(b => ({
    label: b.lo + '–' + b.hi + '%',
    n: b.items.length,
    expected: mean(b.items.map(x => x.c)),
    actual: b.items.length ? mean(b.items.map(x => x.hit ? 100 : 0)) : null,
  }));
}

const signed = (v, unit) => { if (v == null) return '—'; const r = Math.round(v); return (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r) + unit; };
const fmtPct = v => v == null ? '—' : Math.round(v) + '%';
const fmtSkill = v => signed(v, '%');
const fmtPts = v => v == null ? '—' : Math.round(v) + ' pts';
const fmtSignedPts = v => signed(v, ' pts');
const fmtBrier = v => v == null ? '—' : v.toFixed(3);
function overconfWord(v) {
  if (v == null) return '';
  if (Math.abs(v) < 3) return 'no consistent over- or underconfidence';
  return (v > 0 ? 'overconfident' : 'underconfident') + ' by ' + Math.abs(Math.round(v)) + ' pts';
}
function dirWord(v) {
  if (v == null) return '';
  if (Math.abs(v) < 3) return 'no lean toward yes or no';
  return v > 0 ? 'things happen less often than you predict' : 'things happen more often than you predict';
}

/* ---------- Charts (inline SVG) ---------- */
// points: [{ t, v, low, p }]. The low-data prefix (window under MIN_N) is drawn dashed.
function lineChart(points, { min, max, zero = false, cap = 100, fmt, color = 'var(--accent)' }) {
  const W = 340, H = 150, L = 38, R = 8, T = 8, B = 22;
  const vals = points.map(p => p.v).filter(v => v != null);
  if (vals.length < 2) return '<div class="none">Not enough resolved predictions yet.</div>';
  if (zero) { const m = Math.min(cap, Math.max(10, ...vals.map(Math.abs))); min = -Math.ceil(m / 10) * 10; max = -min; }
  if (max === 'auto') max = Math.min(cap, Math.max(20, Math.ceil(Math.max(...vals) / 10) * 10));
  const t0 = points[0].t, t1 = points[points.length - 1].t;
  // Points are spaced evenly by order so several on one day don't stack vertically.
  const x = i => L + i / (points.length - 1) * (W - L - R);
  const y = v => T + (1 - (Math.max(min, Math.min(max, v)) - min) / (max - min)) * (H - T - B);
  let g = '';
  [min, (min + max) / 2, max].forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`;
  });
  if (zero) g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
  g += `<text x="${L}" y="${H - 5}" font-size="10" fill="var(--muted)">${esc(fmtShort(t0))}</text>`;
  g += `<text x="${W - R}" y="${H - 5}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtShort(t1))}</text>`;
  const pts = points.map((p, i) => p.v == null ? null : { x: x(i), y: y(p.v), low: p.low, p }).filter(Boolean);
  const path = a => a.map((q, i) => (i ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1)).join(' ');
  const firstSolid = pts.findIndex(q => !q.low);
  if (firstSolid !== 0) g += `<path d="${path(pts.slice(0, firstSolid === -1 ? pts.length : firstSolid + 1))}" fill="none" stroke="${color}" stroke-width="1.8" stroke-dasharray="4 4" opacity=".6"/>`;
  if (firstSolid !== -1) g += `<path d="${path(pts.slice(firstSolid))}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (pts.length <= 60) pts.forEach(q => {
    const tip = `${fmtDate(isoOf(q.p.t))}: ${fmt(q.p.v)} (${q.p.n} scored)\nLast resolved: ${q.p.p.text}`;
    g += `<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="2.8" fill="var(--surface)" stroke="${color}" stroke-width="1.6" opacity="${q.low ? .5 : 1}"><title>${esc(tip)}</title></circle>`;
  });
  const last = pts[pts.length - 1];
  g += `<circle cx="${last.x}" cy="${last.y}" r="4" fill="${color}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function calibrationHTML(preds) {
  const rows = calibration(preds);
  if (!rows.some(r => r.n)) return '<div class="none">Resolve a few predictions to see calibration.</div>';
  return rows.map(r => `
    <div class="calib-row" style="opacity:${r.n && r.n < SHOW_N ? .55 : 1}">
      <div>${r.label}</div>
      <div class="calib-bar" title="${r.n ? `You said ~${Math.round(r.expected)}%, right ${Math.round(r.actual)}% of the time` : 'No data'}">
        ${r.n ? `<div class="fill" style="width:${r.actual}%"></div><div class="target" style="left:calc(${r.expected}% - 1px)"></div>` : ''}
      </div>
      <div class="n">${r.n ? Math.round(r.actual) + '% · ' + r.n : '—'}</div>
    </div>`).join('') +
    `<div class="muted" style="font-size:12.5px;margin-top:6px">Grouped by confidence in the side you picked. Bar = how often you were right; tick = how confident you were. Bar past the tick means underconfident; short of it means overconfident. Faded rows have fewer than ${SHOW_N} predictions.</div>`;
}

/* ---------- UI prefs ---------- */
const ui = { filter: 'open', window: 'cum', scope: 'all' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + '.ui') || '{}')); } catch (e) {}
const saveUI = () => { try { localStorage.setItem(KEY + '.ui', JSON.stringify(ui)); } catch (e) {} };

/* ---------- Views ---------- */
const ICON = {
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
};

const TABS = { home: 'Prediction Tracker', predictions: 'Predictions', scores: 'Scores', more: 'More' };
const VIEWS = { home: homeHTML, predictions: predictionsHTML, scores: scoresHTML, more: moreHTML };
let tab = null;
const scrollPos = {};

function route() {
  const legacy = location.hash.match(/^#\/c\/(.+)$/);
  if (legacy) { ui.scope = decodeURIComponent(legacy[1]); saveUI(); location.replace('#/scores'); return; }
  const want = (location.hash.match(/^#\/(\w+)/) || [])[1];
  const next = TABS[want] ? want : 'home';
  if (next === tab) { render(); return; }
  if (tab) scrollPos[tab] = window.scrollY;
  tab = next;
  render();
  window.scrollTo(0, scrollPos[tab] || 0);
}

function render() {
  if (ui.scope !== 'all' && !catById(ui.scope)) ui.scope = 'all';
  $('#topbar').innerHTML = `<h1>${TABS[tab]}</h1>`;
  $('#app').innerHTML = VIEWS[tab]();
  document.querySelectorAll('.tab[data-tab]').forEach(a => {
    const on = a.dataset.tab === tab;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

const scopedPreds = () => ui.scope === 'all' ? state.predictions : predsIn(ui.scope);

function scopeChips() {
  const items = [['all', 'All', null], ...state.categories.map(c => [c.id, c.name, c.color])];
  return `<div class="chips" role="group" aria-label="Category">${items.map(([id, name, color]) =>
    `<button class="chip${ui.scope === id ? ' on' : ''}" data-act="scope" data-v="${esc(id)}">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${esc(name)}</button>`).join('')}</div>`;
}

function onboardingHTML() {
  return `<div class="card empty">
    <h2 style="margin:0;font-size:20px">Track how good your predictions are</h2>
    <p>Start by creating a category — e.g. “Work”, “Sports”, “Politics”, “Personal”.</p>
    <button class="btn primary" data-act="new-cat">Create a category</button>
    ${helpHTML()}
  </div>`;
}

function miniScores(s, { skill = true } = {}) {
  if (!s) return `<div class="mini"><span>Scores appear after ${SHOW_N} resolved predictions.</span></div>`;
  return `<div class="mini${s.n < MIN_N ? ' low' : ''}">
    ${skill ? `<span>Skill <b>${fmtSkill(s.skill)}</b></span>` : ''}
    <span>Cal. error <b>${fmtPts(s.calErr)}</b></span>
    <span>Resolution <b>${fmtPct(s.resolution)}</b></span>
    <span>Dir. bias <b>${fmtSignedPts(s.dirBias)}</b></span>
    ${s.n < MIN_N ? `<span>· only ${s.n} scored</span>` : ''}
  </div>`;
}

function homeHTML() {
  if (!state.categories.length) return onboardingHTML();
  const today = todayISO();
  const open = state.predictions.filter(isOpen);
  const due = open.filter(p => p.dueDate && p.dueDate <= today).sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const next = open.filter(p => p.dueDate && p.dueDate > today).sort((a, b) => a.dueDate.localeCompare(b.dueDate))[0];
  const scored = state.predictions.filter(isScored), s = score(scored);
  const SHOW_DUE = 5;
  const cats = state.categories.map(c => {
    const preds = predsIn(c.id);
    return `<a class="card cat-card" href="#/scores" data-act="scope" data-v="${esc(c.id)}" style="--cat:${c.color}">
      <div class="row1"><h3>${esc(c.name)}</h3><div class="counts">${preds.length} total · ${preds.filter(isOpen).length} open</div></div>
      ${miniScores(score(preds.filter(isScored)))}
    </a>`;
  }).join('');
  return `
    <a class="card summary" href="#/scores" data-act="scope" data-v="all">
      <div class="summary-top">
        <div><div class="label">Overall skill</div><div class="big${s && s.n < MIN_N ? ' low' : ''}" style="color:${!s || s.skill == null || s.n < MIN_N ? 'inherit' : s.skill >= 0 ? 'var(--good)' : 'var(--bad)'}">${s ? fmtSkill(s.skill) : '—'}</div></div>
        <div class="counts">${state.predictions.length} predictions<br>${open.length} open · ${scored.length} scored</div>
      </div>
      ${miniScores(s, { skill: false })}
    </a>

    <div class="section-title"><h2>To resolve</h2>${due.length > SHOW_DUE ? `<a class="btn small" href="#/predictions" data-act="scope" data-v="all" data-filter="open">See all ${due.length}</a>` : ''}</div>
    ${due.length ? `<div class="pred-list">${due.slice(0, SHOW_DUE).map(p => predHTML(p, true)).join('')}</div>`
      : `<div class="card notice">Nothing is past its resolve-by date.${next ? ` Next up: “${esc(next.text)}” on ${fmtDate(next.dueDate)}.` : ''}</div>`}

    <div class="section-title"><h2>Categories</h2><button class="btn small" data-act="new-cat">+ Category</button></div>
    <div class="cat-list">${cats}</div>
  `;
}

function predictionsHTML() {
  if (!state.categories.length) return onboardingHTML();
  const preds = scopedPreds();
  const f = ui.filter;
  const list = preds
    .filter(p => f === 'all' || (f === 'open' ? isOpen(p) : !isOpen(p)))
    .sort((a, b) => {
      if (f === 'open') {
        // Soonest due first, undated last, then newest.
        const da = a.dueDate || '9999', db = b.dueDate || '9999';
        return da.localeCompare(db) || b.createdAt.localeCompare(a.createdAt);
      }
      const ka = a.resolvedAt || a.createdAt, kb = b.resolvedAt || b.createdAt;
      return kb.localeCompare(ka) || b.ts - a.ts;
    });
  const open = preds.filter(isOpen).length;
  const counts = { open, resolved: preds.length - open, all: preds.length };
  return `
    ${scopeChips()}
    <div class="seg full" role="group" aria-label="Filter">
      ${['open', 'resolved', 'all'].map(k => `<button data-act="filter" data-v="${k}" class="${f === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)} ${counts[k]}</button>`).join('')}
    </div>
    <div class="pred-list">
      ${list.length ? list.map(p => predHTML(p, ui.scope === 'all')).join('') :
        `<div class="card empty"><p>${preds.length ? 'Nothing here.' : 'No predictions here yet.'}</p>${preds.length ? '' : '<button class="btn primary" data-act="add">Add a prediction</button>'}</div>`}
    </div>`;
}

function scoresHTML() {
  if (!state.categories.length) return onboardingHTML();
  const preds = scopedPreds();
  return `
    ${scopeChips()}
    ${statsHTML(preds)}
    ${preds.some(isScored) ? `<div class="section-title"><h2>Trends</h2>${windowSeg()}</div>${chartsHTML(preds)}` : ''}
    ${ui.scope === 'all' && state.categories.length > 1 ? `<p class="muted" style="font-size:13px;margin:12px 2px 0">“All” mixes categories of different difficulty, so compare categories by skill score rather than Brier.</p>` : ''}
    ${helpHTML()}`;
}

function moreHTML() {
  const bytes = new Blob([localStorage.getItem(KEY) || '']).size;
  const cats = state.categories.map(c => `
    <button class="row" data-act="edit-cat" data-id="${c.id}">

  `;

function tile(label, value, range, sub, { low, color } = {}) {
  return `<div class="stat${low ? ' low' : ''}">
    <div class="label">${label}</div>
    <div class="value"${color && !low ? ` style="color:${color}"` : ''}>${value}</div>
    ${range ? `<div class="range">90% range ${range}</div>` : ''}
    <div class="sub">${sub}</div>
  </div>`;
}

function statsHTML(preds) {
  const scored = preds.filter(isScored), s = score(scored);
  const open = preds.filter(isOpen).length, n = scored.length;
  const counts = `<div class="counts-line">${preds.length} prediction${preds.length === 1 ? '' : 's'} · ${open} open · ${n} scored</div>`;
  if (!s) {
    return counts + `<div class="card notice">Resolve ${SHOW_N - n} more prediction${SHOW_N - n === 1 ? '' : 's'} (happened / didn’t) to see scores. They become reliable at about ${MIN_N}.</div>`;
  }
  const low = n < MIN_N;
  const R = ranges(scored);
  const range = (k, fmt) => R[k] ? `${fmt(R[k][0])} to ${fmt(R[k][1])}` : '';
  return counts +
    (low ? `<div class="card notice">Only ${n} scored — these numbers are mostly noise until about ${MIN_N}. The ranges show how much they could move.</div>` : '') +
    `<div class="stats">
      ${tile('Skill score', fmtSkill(s.skill), range('skill', fmtSkill),
        s.skill == null ? 'needs both outcomes to compute' : `vs. always guessing the base rate · Brier ${fmtBrier(s.brier)} · hit rate ${fmtPct(s.hitRate)}`,
        { low, color: s.skill == null ? null : s.skill >= 0 ? 'var(--good)' : 'var(--bad)' })}
      ${tile('Calibration error', fmtPts(s.calErr), range('calErr', fmtPts), overconfWord(s.overconf) || 'lower is better', { low })}
      ${tile('Resolution', fmtPct(s.resolution), range('resolution', fmtPct),
        s.resolution != null ? 'how well you separate what happens from what doesn’t'
          : s.baseRate % 100 === 0 ? 'needs both outcomes to compute'
          : `needs ${MIN_BIN * 2}+ predictions spread across different probabilities`, { low })}
      ${tile('Direction bias', fmtSignedPts(s.dirBias), range('dirBias', fmtSignedPts), dirWord(s.dirBias), { low })}
    </div>`;
}

const WINDOW = 25;
const windowSize = () => ui.window === 'cum' ? 'cum' : WINDOW;
function windowSeg() {
  return `<div class="seg" role="group" aria-label="Averaging window">
    <button data-act="window" data-v="cum" class="${ui.window === 'cum' ? 'on' : ''}">All-time</button>
    <button data-act="window" data-v="${WINDOW}" class="${ui.window !== 'cum' ? 'on' : ''}">Last ${WINDOW}</button>
  </div>`;
}

function chartsHTML(preds) {
  const s = series(preds, windowSize());
  const pick = k => s.map(x => ({ t: x.t, v: x.s[k], n: x.s.n, low: x.low, p: x.p }));
  const how = ui.window === 'cum' ? 'All predictions so far' : `Last ${WINDOW} predictions`;
  const card = (title, desc, chart) => `<div class="card chart-card"><h4>${title}</h4><div class="desc">${desc}</div>${chart}</div>`;
  return `<div class="charts">
    ${card('Skill score', `Higher is better · 0 = no better than the base rate`,
      lineChart(pick('skill'), { zero: true, fmt: v => signed(v, ''), color: 'var(--good)' }))}
    ${card('Calibration error', `Lower is better · points between your % and reality`,
      lineChart(pick('calErr'), { min: 0, max: 'auto', fmt: v => Math.round(v), color: 'var(--bad)' }))}
    ${card('Resolution', `Higher is better · separating yes from no`,
      lineChart(pick('resolution'), { min: 0, max: 100, fmt: fmtPct, color: 'var(--accent)' }))}
    ${card('Direction bias', `Above 0 = things happen less often than you predict`,
      lineChart(pick('dirBias'), { zero: true, fmt: v => signed(v, ''), color: 'var(--warn)' }))}
    <div class="card chart-card wide"><h4>Calibration</h4><div class="desc">All resolved predictions</div>${calibrationHTML(preds)}</div>
  </div>
  <p class="muted" style="font-size:12.5px;margin:8px 2px 0">${how}, recalculated at each resolution date. Dashed = fewer than ${MIN_N} predictions behind the point.</p>`;
}

function predHTML(p, showCat) {
  const c = catById(p.categoryId);
  const today = todayISO();
  let status = '';
  if (p.outcome === 'true' || p.outcome === 'false') {
    const hit = p.confidence === 50 ? null : (p.confidence > 50) === (p.outcome === 'true');
    status = `<span class="pill ${hit == null ? '' : hit ? 'good' : 'bad'}">${p.outcome === 'true' ? 'Happened' : 'Didn’t happen'}${hit == null ? '' : hit ? ' ✓' : ' ✗'}</span>`;
  } else if (p.outcome === 'void') {
    status = '<span class="pill">Void</span>';
  } else if (p.dueDate && p.dueDate <= today) {
    status = '<span class="pill warn">Due</span>';
  }
  return `<div class="card pred" data-id="${p.id}">
    <div class="ptext" data-act="edit-pred" data-id="${p.id}">${esc(p.text)}</div>
    <div class="meta">
      <span class="pill" title="Your stated probability that this happens">${p.confidence}% · ${confWord(p.confidence)}</span>
      ${status}
      ${showCat && c ? `<span class="pill" style="--cat:${c.color}"><span class="dot"></span>${esc(c.name)}</span>` : ''}
      <span>Made ${fmtDate(p.createdAt)}</span>
      ${p.ts && p.createdAt < isoOf(p.ts) ? `<span title="Entered after the date it says it was made">logged ${fmtDate(isoOf(p.ts))}</span>` : ''}
      ${p.dueDate && isOpen(p) ? `<span>Resolves ${fmtDate(p.dueDate)}</span>` : ''}
      ${p.resolvedAt && !isOpen(p) ? `<span>Resolved ${fmtDate(p.resolvedAt)}</span>` : ''}
    </div>
    ${p.notes ? `<div class="muted" style="font-size:14px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.notes)}</div>` : ''}
    ${isOpen(p) ? `<div class="actions">
      <button class="btn small good" data-act="resolve" data-id="${p.id}" data-v="true">✓ Happened</button>
      <button class="btn small bad" data-act="resolve" data-id="${p.id}" data-v="false">✗ Didn’t</button>
    </div>` : ''}
  </div>`;
}

function helpHTML() {
  return `<details class="help card" style="margin-top:20px"><summary>How the numbers work</summary><div><dl>
    <dt>Probability</dt><dd>For each prediction you give the chance (1–99%) that it comes true. 30% means you lean “no”. Only predictions resolved as happened / didn’t are scored.</dd>
    <dt>Skill score</dt><dd>How much better your Brier score is than always guessing the category’s base rate (how often things in it actually happened). 0% = no better than that; 100% = perfect; negative = worse. Because it adjusts for how predictable a category is, it’s the fair way to compare categories.</dd>
    <dt>Brier score</dt><dd>Mean of (probability − outcome)², where outcome is 1 or 0. 0 is perfect; always saying 50% gets 0.25. It splits into: Brier ≈ calibration part − resolution part + uncertainty (how hard the category is).</dd>
    <dt>Calibration error</dt><dd>Your predictions are grouped into tenths (0–9%, 10–19%, … 90–99%), merging neighbouring groups until each has at least ${MIN_BIN}. In each group, compare your average probability with how often those things happened. Calibration error is the typical gap in points (the square root of the Brier calibration part). 0 = your 70%s happen 70% of the time. The line below it says which way you tend to miss: overconfident or underconfident.</dd>
    <dt>Resolution</dt><dd>How different the outcomes are across those groups: do the things you rate highly actually happen more than the things you rate low? 0% = your probabilities carry no information beyond the base rate; 100% = they perfectly separate what happens from what doesn’t.</dd>
    <dt>Direction bias</dt><dd>Your average probability minus how often things actually happened. +10 pts means things happen less often than you predict (e.g. optimism about your own plans); negative means more often.</dd>
    <dt>Hit rate</dt><dd>Share of predictions that went the way you leaned. Shown for reference only — it ignores how confident you were.</dd>
    <dt>Ranges and low data</dt><dd>The “90% range” under each number is a bootstrap estimate of how much it could move by luck alone. With fewer than ${MIN_N} scored predictions, numbers are greyed out and charts are dashed. With so little data, calibration error also tends to come out too high.</dd>
    <dt>Locking</dt><dd>A prediction’s statement, probability and “made on” date can be corrected for ${LOCK_MIN} minutes after you add it, then they lock so your record can’t be revised with hindsight. Outcome, category, resolve-by date and notes stay editable. If your view changes, add a new prediction.</dd>
    <dt>Void</dt><dd>Mark a prediction void if it can't be resolved fairly. It's excluded from every score.</dd>
    <dt>Your data</dt><dd>Everything is stored only in this browser's local storage. Use More → Export to back it up or move it to another device.</dd>
  </dl></div></details>`;
}

/* ---------- Dialogs ---------- */
const dlg = $('#dlg');
function openDialog(title, body, foot) {
  dlg.innerHTML = `<form method="dialog" id="dlg-form" novalidate>
    <div class="dlg-head"><h3>${title}</h3><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="dlg-body">${body}</div>
    <div class="dlg-foot">${foot}</div>
  </form>`;
  dlg.showModal();
  $('[data-close]', dlg).onclick = () => dlg.close();
  return $('#dlg-form', dlg);
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

function categoryDialog(cat) {
  let color = cat ? cat.color : COLORS[state.categories.length % COLORS.length];
  const n = cat ? predsIn(cat.id).length : 0;
  const form = openDialog(cat ? 'Edit category' : 'New category', `
    <label class="field">Name<input type="text" name="cname" required maxlength="60" value="${esc(cat?.name)}" placeholder="e.g. Work, Sports, Politics" autocomplete="off"></label>
    <div class="field" style="display:grid;gap:8px;font-size:14px;font-weight:600">Color<div class="swatches">${COLORS.map(c => `<button type="button" style="--sw:${c}" data-c="${c}" class="${c === color ? 'on' : ''}" aria-label="Color ${c}"></button>`).join('')}</div></div>
  `, `${cat ? '<button type="button" class="btn danger" data-del>Delete</button><span class="spacer"></span>' : ''}
      <button type="button" class="btn" data-close2>Cancel</button><button class="btn primary" value="ok">${cat ? 'Save' : 'Create'}</button>`);
  form.querySelectorAll('.swatches button').forEach(b => b.onclick = () => {
    color = b.dataset.c;
    form.querySelectorAll('.swatches button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('[data-close2]', form).onclick = () => dlg.close();
  const del = $('[data-del]', form);
  if (del) del.onclick = () => {
    if (!confirm(`Delete “${cat.name}”${n ? ` and its ${n} prediction${n > 1 ? 's' : ''}` : ''}? This can't be undone.`)) return;
    state.categories = state.categories.filter(c => c.id !== cat.id);
    state.predictions = state.predictions.filter(p => p.categoryId !== cat.id);
    if (ui.scope === cat.id) { ui.scope = 'all'; saveUI(); }
    save(); dlg.close(); render();
    toast(`Deleted “${cat.name}”`);
  };
  form.onsubmit = e => {
    e.preventDefault();
    const name = form.cname.value.trim();
    if (!name) { form.cname.focus(); return; }
    if (cat) { cat.name = name; cat.color = color; save(); dlg.close(); render(); }
    else {
      const c = { id: uid(), name, color, createdAt: todayISO() };
      state.categories.push(c); save(); dlg.close(); render();
      toast(`Created “${name}” — tap + to add a prediction`);
    }
  };
  setTimeout(() => { if (!cat) form.cname.focus(); }, 50);
}

function predictionDialog(pred, defaultCat) {
  const p = pred || { confidence: 70, createdAt: todayISO(), categoryId: defaultCat || state.categories[0]?.id, outcome: null };
  const locked = !!pred && isLocked(pred);
  let outcome = p.outcome || '';
  const lockNote = !pred
    ? `You can fix typos for ${LOCK_MIN} minutes. After that the statement, probability and date lock, so your record can’t be revised with hindsight.`
    : locked
      ? `🔒 Statement, probability and date are locked. Changed your mind? Add a new prediction instead.`
      : `Statement, probability and date can be edited for ${Math.ceil(lockLeftMs(pred) / 6e4)} more min, then they lock.`;
  const form = openDialog(pred ? 'Edit prediction' : 'New prediction', `
    <div class="lock-note">${lockNote}</div>
    ${locked ? `<div class="field">Prediction<div class="locked-val">${esc(p.text)}</div></div>` : `
    <label class="field">Prediction<span class="hint">Write it so it can be clearly judged true or false later.</span>
      <textarea name="text" required rows="2" maxlength="500" placeholder="e.g. The project ships before March 1">${esc(pred?.text)}</textarea></label>`}
    <label class="field">Category<select name="cat">${state.categories.map(c => `<option value="${c.id}" ${c.id === p.categoryId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
    <div class="field">
      <div class="conf-display"><span>Chance it happens</span><span><span class="big" id="conf-v">${p.confidence}%</span></span></div>
      ${locked ? '' : `<input type="range" name="conf" min="1" max="99" step="1" value="${p.confidence}" aria-label="Probability">`}
      <div class="conf-display"><span class="word" id="conf-w">${confWord(p.confidence)}</span></div>
      ${locked ? '' : `<div class="quick">${[5, 10, 25, 40, 50, 60, 75, 90, 95].map(v => `<button type="button" data-q="${v}">${v}%</button>`).join('')}</div>`}
    </div>
    <div class="row2">
      ${locked ? `<div class="field">Made on<div class="locked-val">${fmtDate(p.createdAt)}</div></div>`
        : `<label class="field">Made on<input type="date" name="created" value="${p.createdAt}" required></label>`}
      <label class="field">Resolves by<input type="date" name="due" value="${p.dueDate || ''}"></label>
    </div>
    ${pred ? `<div class="field">Outcome
      <div class="outcome-choice">${[['', 'Open'], ['true', 'Happened'], ['false', 'Didn’t'], ['void', 'Void']].map(([v, l]) => `<button type="button" data-o="${v}" class="${outcome === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <label class="field" id="resolved-wrap" ${outcome ? '' : 'hidden'}>Resolved on<input type="date" name="resolved" value="${p.resolvedAt || todayISO()}"></label>` : ''}
    <label class="field">Notes <span class="hint">Optional — reasoning, sources, resolution criteria.</span><textarea name="notes" rows="2" maxlength="2000">${esc(pred?.notes)}</textarea></label>
  `, `${pred ? '<button type="button" class="btn danger" data-del>Delete</button><span class="spacer"></span>' : ''}
      <button type="button" class="btn" data-close2>Cancel</button><button class="btn primary" value="ok">${pred ? 'Save' : 'Add'}</button>`);
  const setConf = v => {
    form.conf.value = v;
    $('#conf-v', form).textContent = v + '%';
    $('#conf-w', form).textContent = confWord(+v);
  };
  if (form.conf) form.conf.oninput = () => setConf(form.conf.value);
  form.querySelectorAll('[data-q]').forEach(b => b.onclick = () => setConf(b.dataset.q));
  form.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    outcome = b.dataset.o;
    form.querySelectorAll('[data-o]').forEach(x => x.classList.toggle('on', x === b));
    $('#resolved-wrap', form).hidden = !outcome;
  });
  $('[data-close2]', form).onclick = () => dlg.close();
  const del = $('[data-del]', form);
  if (del) del.onclick = () => {
    if (locked && !confirm('Delete this prediction from your record?\n\nIf it just can’t be judged fairly, mark it Void instead — deleting predictions that went badly makes your scores look better than they are.')) return;
    const idx = state.predictions.indexOf(pred);
    state.predictions.splice(idx, 1); save(); dlg.close(); render();
    toast('Prediction deleted', () => { state.predictions.splice(idx, 0, pred); save(); render(); });
  };
  form.onsubmit = e => {
    e.preventDefault();
    const target = pred || { id: uid(), ts: Date.now(), outcome: null };
    // Re-check: the lock may have kicked in while the dialog was open.
    if (!pred || !isLocked(pred)) {
      const text = form.text.value.trim();
      if (!text) { form.text.focus(); return; }
      Object.assign(target, { text, confidence: +form.conf.value, createdAt: form.created.value || todayISO() });
    } else if (!locked) {
      toast('This prediction locked while the dialog was open — only outcome, category, dates and notes were saved.');
    }
    Object.assign(target, { categoryId: form.cat.value, dueDate: form.due.value || null, notes: form.notes.value.trim() });
    if (pred) {
      target.outcome = outcome || null;
      target.resolvedAt = outcome ? (form.resolved.value || todayISO()) : null;
    } else {
      state.predictions.push(target);
    }
    save(); dlg.close();
    render();
    if (!pred) toast(`Added to ${catById(target.categoryId)?.name || 'predictions'}`);
  };
  setTimeout(() => { if (!pred) form.text.focus(); }, 50);
}

function exportData() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `predictions-${todayISO()}.json` });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function eraseData() {
  if (!confirm('Erase all categories and predictions from this browser? Export a backup first if you might want them.')) return;
  state = blank(); ui.scope = 'all'; saveUI(); save(); render();
}

$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.categories) || !Array.isArray(data.predictions)) throw new Error('Not a prediction tracker backup.');
    const replace = !state.predictions.length && !state.categories.length ||
      confirm('Replace your current data with this backup?\n\nOK = replace everything\nCancel = merge (keep both)');
    if (replace) state = { version: 1, categories: data.categories, predictions: data.predictions };
    else {
      const haveC = new Set(state.categories.map(c => c.id)), haveP = new Set(state.predictions.map(p => p.id));
      state.categories.push(...data.categories.filter(c => !haveC.has(c.id)));
      state.predictions.push(...data.predictions.filter(p => !haveP.has(p.id)));
    }
    save(); render();
    toast(`Imported ${data.predictions.length} predictions`);
  } catch (err) { toast('Import failed: ' + err.message); }
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undo) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 5000);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act], .tab[data-tab]');
  if (!el || el.closest('dialog')) return;
  // Tapping the tab you're already on scrolls back to the top.
  if (el.dataset.tab && el.dataset.tab === tab) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const { act, id, v } = el.dataset;
  if (act === 'add') state.categories.length ? predictionDialog(null, ui.scope !== 'all' ? ui.scope : undefined) : categoryDialog(null);
  else if (act === 'new-cat') categoryDialog(null);
  else if (act === 'edit-cat') categoryDialog(catById(id));
  else if (act === 'edit-pred') predictionDialog(state.predictions.find(p => p.id === id));
  else if (act === 'scope') {
    // Links (category cards, summary) set the scope and then navigate via their href.
    ui.scope = v; if (el.dataset.filter) ui.filter = el.dataset.filter; saveUI();
    delete scrollPos.predictions; delete scrollPos.scores;
    if (el.tagName !== 'A') render();
  }
  else if (act === 'filter') { ui.filter = v; saveUI(); render(); }
  else if (act === 'window') { ui.window = v; saveUI(); render(); }
  else if (act === 'export') exportData();
  else if (act === 'import') $('#import-file').click();
  else if (act === 'erase') eraseData();
  else if (act === 'resolve') {
    const p = state.predictions.find(p => p.id === id);
    const prev = { outcome: p.outcome, resolvedAt: p.resolvedAt };
    p.outcome = v; p.resolvedAt = todayISO(); save(); render();
    const hit = p.confidence === 50 ? null : (p.confidence > 50) === (v === 'true');
    toast(hit == null ? 'Resolved' : hit ? 'Resolved — you called it ✓' : 'Resolved — missed this one', () => { Object.assign(p, prev); save(); render(); });
  }
});
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if (e.key === KEY) { state = load(); route(); } });
route();
})();
</script>
</body>
</html>
