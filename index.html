<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Predictions">
<title>Prediction Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233a5bd9'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #efede7;
    --border: #e1ded6;
    --text: #1d1d1f;
    --muted: #6b6a66;
    --accent: #3a5bd9;
    --accent-ink: #ffffff;
    --good: #1f8a5b;
    --bad: #c8412f;
    --warn: #b7791f;
    --grid: #e7e4dc;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --surface: #1f2024;
      --surface-2: #2a2b30;
      --border: #33343a;
      --text: #ecebe8;
      --muted: #9a9993;
      --accent: #7b93ff;
      --accent-ink: #0f1330;
      --good: #4cc38a;
      --bad: #ff7b6b;
      --warn: #e3b25b;
      --grid: #2d2e33;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  header.top {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  }
  .top-inner { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .top h1 { font-size: 19px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }

  .icon-btn {
    border: 0; background: transparent; width: 40px; height: 40px; border-radius: 10px;
    display: inline-grid; place-items: center; cursor: pointer; color: var(--text); flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn svg { width: 22px; height: 22px; }

  .btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; font-weight: 550; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 6px 10px; font-size: 14px; }
  .btn.good { color: var(--good); }
  .btn.bad { color: var(--bad); }

  .fab {
    position: fixed; right: max(16px, calc(50vw - 364px)); bottom: calc(20px + env(safe-area-inset-bottom));
    z-index: 6; border: 0; border-radius: 999px; padding: 14px 20px 14px 16px;
    background: var(--accent); color: var(--accent-ink); font-weight: 650; font-size: 16px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .fab svg { width: 22px; height: 22px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
  }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 24px 2px 10px; gap: 10px; }
  .section-title h2 { font-size: 15px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }

  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 560px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .stat .label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .stat .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .sub { font-size: 12.5px; color: var(--muted); }

  .cat-list { display: grid; gap: 10px; }
  .cat-card { display: block; text-decoration: none; color: inherit; position: relative; overflow: hidden; padding-left: 20px; }
  .cat-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--cat); }
  .cat-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cat-card h3 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
  .cat-card .counts { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
  .mini { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .mini span { color: var(--muted); }
  .mini b { font-weight: 650; color: var(--text); }

  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 550; color: var(--muted); white-space: nowrap; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); }

  .pred-list { display: grid; gap: 10px; }
  .pred { padding: 14px 14px 12px; }
  .pred .ptext { font-size: 16px; overflow-wrap: anywhere; cursor: pointer; }
  .pred .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat); }
  .pred .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pred .actions .btn { flex: 1; min-width: 90px; }

  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .empty p { margin: 6px 0 16px; }

  .charts { display: grid; gap: 12px; }
  @media (min-width: 640px) { .charts { grid-template-columns: 1fr 1fr; } .charts .wide { grid-column: 1 / -1; } }
  .chart-card h4 { margin: 0; font-size: 15px; }
  .chart-card .desc { margin: 2px 0 8px; font-size: 13px; color: var(--muted); }
  .chart-card svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart-card .none { color: var(--muted); font-size: 14px; padding: 30px 0; text-align: center; }

  .calib-row { display: grid; grid-template-columns: 70px 1fr 64px; align-items: center; gap: 10px; font-size: 14px; padding: 5px 0; font-variant-numeric: tabular-nums; }
  .calib-bar { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
  .calib-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--accent); opacity: .85; }
  .calib-bar .target { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); border-radius: 1px; }
  .calib-row .n { color: var(--muted); text-align: right; font-size: 13px; }

  details.help { margin-top: 16px; }
  details.help summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details.help div { font-size: 14px; color: var(--muted); }
  details.help dt { color: var(--text); font-weight: 650; margin-top: 10px; }
  details.help dd { margin: 2px 0 0; }

  dialog {
    border: 0; padding: 0; background: var(--surface); color: var(--text);
    width: min(560px, 100vw); max-height: 92vh; border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  @media (max-width: 600px) {
    dialog { margin: auto 0 0; width: 100vw; max-width: 100vw; border-radius: 18px 18px 0 0; max-height: 94vh; }
  }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
  .dlg-head h3 { margin: 0; font-size: 18px; }
  .dlg-body { padding: 8px 16px 16px; display: grid; gap: 14px; }
  .dlg-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .dlg-foot .spacer { flex: 1; }
  label.field { display: grid; gap: 6px; font-size: 14px; font-weight: 600; }
  label.field .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 10px;
    padding: 10px 12px; font-size: 16px; font-weight: 400;
  }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .conf-display { display: flex; align-items: baseline; justify-content: space-between; }
  .conf-display .big { font-size: 30px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .conf-display .word { font-size: 13px; color: var(--muted); font-weight: 500; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 4px 9px; font-size: 13.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .quick button:hover { background: var(--surface-2); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--sw); cursor: pointer; }
  .swatches button.on { border-color: var(--text); }
  .outcome-choice { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .outcome-choice button { border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 8px 4px; cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .outcome-choice button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  .menu { display: grid; gap: 8px; }
  .menu .btn { justify-content: flex-start; width: 100%; }
  .muted { color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    z-index: 100; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100vw - 32px);
    display: flex; gap: 14px; align-items: center;
  }
  .toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }
  @media (prefers-color-scheme: dark) { .toast button { color: #3a5bd9; } }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top"><div class="top-inner" id="topbar"></div></header>
<main id="app"></main>
<button class="fab" id="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span id="fab-label">Prediction</span>
</button>
<dialog id="dlg"></dialog>
<input type="file" id="import-file" accept="application/json,.json" class="sr">

<script>
(() => {
'use strict';

/* ---------- Storage ---------- */
const KEY = 'prediction-tracker.v1';
const COLORS = ['#3a5bd9', '#1f8a5b', '#c8412f', '#b7791f', '#8a46c4', '#0f8f9e', '#d14f8f', '#5b6b7d'];

function blank() { return { version: 1, categories: [], predictions: [] }; }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return blank();
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.categories) && Array.isArray(s.predictions)) return s;
  } catch (e) { /* fall through */ }
  return blank();
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { toast('Could not save to local storage: ' + e.message); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dayMs = iso => new Date(iso + 'T12:00:00').getTime();
const fmtDate = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const fmtShort = ms => new Date(ms).toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const catById = id => state.categories.find(c => c.id === id);
const predsIn = catId => catId ? state.predictions.filter(p => p.categoryId === catId) : state.predictions;
const isScored = p => p.outcome === 'true' || p.outcome === 'false';
const isOpen = p => !p.outcome;

function confWord(c) {
  const d = Math.max(c, 100 - c);
  if (c === 50) return 'coin flip';
  const dir = c > 50 ? 'likely' : 'unlikely';
  if (d >= 97) return c > 50 ? 'near certain' : 'near impossible';
  if (d >= 85) return 'very ' + dir;
  if (d >= 65) return dir;
  return 'slightly ' + dir;
}

/* ---------- Metrics ----------
   confidence = stated probability (1–99%) that the statement comes true.
   Specificity  = how far from a coin flip: |p − 50| × 2  (0% = 50/50, 100% = certain).
   Accuracy     = share of directional calls (p ≠ 50) that went the way you leaned.
   Brier        = mean (p − outcome)², 0 is perfect, 0.25 = always saying 50%.
   Bias         = avg confidence in the side you picked − how often that side was right.
                  Positive = overconfident, negative = underconfident.
*/
function specOf(p) { return Math.abs(p.confidence - 50) * 2; }
function metrics(preds) {
  const live = preds.filter(p => p.outcome !== 'void');
  const scored = preds.filter(isScored);
  const directional = scored.filter(p => p.confidence !== 50);
  const hits = directional.map(p => (p.confidence > 50) === (p.outcome === 'true') ? 1 : 0);
  const accuracy = directional.length ? mean(hits) * 100 : null;
  const avgConf = directional.length ? mean(directional.map(p => Math.max(p.confidence, 100 - p.confidence))) : null;
  return {
    total: preds.length,
    open: preds.filter(isOpen).length,
    scored: scored.length,
    specificity: live.length ? mean(live.map(specOf)) : null,
    accuracy,
    brier: scored.length ? mean(scored.map(p => (p.confidence / 100 - (p.outcome === 'true' ? 1 : 0)) ** 2)) : null,
    bias: accuracy == null ? null : avgConf - accuracy,
  };
}

// Running series. mode: 'cum' (everything so far) or a number (rolling window).
function series(preds, mode) {
  const byCreated = preds.filter(p => p.outcome !== 'void').slice().sort((a, b) => a.createdAt.localeCompare(b.createdAt) || a.ts - b.ts);
  const byResolved = preds.filter(p => isScored(p) && p.confidence !== 50).slice()
    .sort((a, b) => (a.resolvedAt || '').localeCompare(b.resolvedAt || '') || a.ts - b.ts);
  const win = (arr, i) => mode === 'cum' ? arr.slice(0, i + 1) : arr.slice(Math.max(0, i + 1 - mode), i + 1);
  const spec = byCreated.map((p, i) => ({ t: dayMs(p.createdAt), v: mean(win(byCreated, i).map(specOf)), p }));
  const acc = [], bias = [];
  byResolved.forEach((p, i) => {
    const m = metrics(win(byResolved, i));
    const t = dayMs(p.resolvedAt || p.createdAt);
    acc.push({ t, v: m.accuracy, p });
    bias.push({ t, v: m.bias, p });
  });
  return { spec, acc, bias };
}

function calibration(preds) {
  const buckets = [[50, 59], [60, 69], [70, 79], [80, 89], [90, 99]].map(([lo, hi]) => ({ lo, hi, items: [] }));
  preds.filter(p => isScored(p) && p.confidence !== 50).forEach(p => {
    const c = Math.max(p.confidence, 100 - p.confidence);
    const b = buckets.find(b => c >= b.lo && c <= b.hi);
    if (b) b.items.push({ c, hit: (p.confidence > 50) === (p.outcome === 'true') });
  });
  return buckets.map(b => ({
    label: b.lo + '–' + b.hi + '%',
    n: b.items.length,
    expected: mean(b.items.map(x => x.c)),
    actual: b.items.length ? mean(b.items.map(x => x.hit ? 100 : 0)) : null,
  }));
}

const fmtPct = v => v == null ? '—' : Math.round(v) + '%';
const fmtBias = v => { if (v == null) return '—'; const r = Math.round(v); return (r > 0 ? '+' : r < 0 ? '−' : '±') + Math.abs(r) + ' pts'; };
const fmtBrier = v => v == null ? '—' : v.toFixed(3);
function biasWord(v) {
  if (v == null) return 'needs resolved calls';
  if (Math.abs(v) < 3) return 'well calibrated';
  return v > 0 ? 'overconfident' : 'underconfident';
}

/* ---------- Charts (inline SVG) ---------- */
function lineChart(points, { min, max, zero = false, fmt, color = 'var(--accent)' }) {
  if (points.length < 2) return '<div class="none">Need at least 2 data points to chart a trend.</div>';
  const W = 340, H = 150, L = 38, R = 8, T = 8, B = 22;
  const vals = points.map(p => p.v).filter(v => v != null);
  if (zero) { const m = Math.max(10, ...vals.map(Math.abs)); min = -Math.ceil(m / 10) * 10; max = -min; }
  const t0 = points[0].t, t1 = points[points.length - 1].t;
  // Points are spaced evenly by order so several on one day don't stack vertically.
  const x = i => L + i / (points.length - 1) * (W - L - R);
  const y = v => T + (1 - (v - min) / (max - min)) * (H - T - B);
  const ticks = [min, (min + max) / 2, max];
  let g = '';
  ticks.forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(v)}</text>`;
  });
  if (zero) g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
  g += `<text x="${L}" y="${H - 5}" font-size="10" fill="var(--muted)">${esc(fmtShort(t0))}</text>`;
  g += `<text x="${W - R}" y="${H - 5}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtShort(t1))}</text>`;
  const pts = points.map((p, i) => p.v == null ? null : [x(i), y(Math.max(min, Math.min(max, p.v)))]).filter(Boolean);
  const d = pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
  g += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (pts.length <= 60) pts.forEach((q, i) => {
    const p = points[i];
    g += `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.8" fill="var(--surface)" stroke="${color}" stroke-width="1.6"><title>${esc(fmtDate(new Date(p.t).toISOString().slice(0, 10)))}: ${esc(fmt(p.v))}\n${esc(p.p.text)}</title></circle>`;
  });
  const last = pts[pts.length - 1];
  g += `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function calibrationHTML(preds) {
  const rows = calibration(preds);
  if (!rows.some(r => r.n)) return '<div class="none">Resolve a few predictions to see calibration.</div>';
  return rows.map(r => `
    <div class="calib-row">
      <div>${r.label}</div>
      <div class="calib-bar" title="${r.n ? `You said ~${Math.round(r.expected)}%, right ${Math.round(r.actual)}% of the time` : 'No data'}">
        ${r.n ? `<div class="fill" style="width:${r.actual}%"></div><div class="target" style="left:calc(${r.expected}% - 1px)"></div>` : ''}
      </div>
      <div class="n">${r.n ? Math.round(r.actual) + '% · ' + r.n : '—'}</div>
    </div>`).join('') +
    `<div class="muted" style="font-size:12.5px;margin-top:6px">Bar = how often you were right. Tick = how confident you were. Bar past the tick means underconfident; short of it means overconfident.</div>`;
}

/* ---------- UI prefs ---------- */
const ui = { filter: 'open', window: 'cum' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(KEY + '.ui') || '{}')); } catch (e) {}
const saveUI = () => { try { localStorage.setItem(KEY + '.ui', JSON.stringify(ui)); } catch (e) {} };

/* ---------- Views ---------- */
const ICON = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

function route() {
  const m = location.hash.match(/^#\/c\/(.+)$/);
  const catId = m && decodeURIComponent(m[1]);
  if (catId && !catById(catId)) { location.hash = '#/'; return; }
  render(catId || null);
}

let currentCat = null;
function render(catId = currentCat) {
  currentCat = catId;
  const app = $('#app'), top = $('#topbar');
  $('#fab-label').textContent = state.categories.length ? 'Prediction' : 'Category';
  if (!catId) {
    top.innerHTML = `<h1>Prediction Tracker</h1><button class="icon-btn" data-act="menu" aria-label="Menu">${ICON.more}</button>`;
    app.innerHTML = homeHTML();
  } else {
    const c = catById(catId);
    top.innerHTML = `<a class="icon-btn" href="#/" aria-label="Back">${ICON.back}</a>
      <h1><span class="pill" style="--cat:${c.color};background:none;padding:0 6px 0 0"><span class="dot" style="width:12px;height:12px"></span></span>${esc(c.name)}</h1>
      <button class="icon-btn" data-act="edit-cat" data-id="${c.id}" aria-label="Edit category">${ICON.edit}</button>`;
    app.innerHTML = categoryHTML(c);
  }
}

function statsHTML(m) {
  return `<div class="stats">
    <div class="stat"><div class="label">Accuracy</div><div class="value">${fmtPct(m.accuracy)}</div><div class="sub">Brier ${fmtBrier(m.brier)}</div></div>
    <div class="stat"><div class="label">Avg specificity</div><div class="value">${fmtPct(m.specificity)}</div><div class="sub">0% = 50/50 · 100% = certain</div></div>
    <div class="stat"><div class="label">Bias</div><div class="value" style="color:${m.bias == null || Math.abs(m.bias) < 3 ? 'inherit' : m.bias > 0 ? 'var(--bad)' : 'var(--warn)'}">${fmtBias(m.bias)}</div><div class="sub">${biasWord(m.bias)}</div></div>
    <div class="stat"><div class="label">Predictions</div><div class="value">${m.total}</div><div class="sub">${m.open} open · ${m.scored} scored</div></div>
  </div>`;
}

function homeHTML() {
  if (!state.categories.length) {
    return `<div class="card empty">
      <h2 style="margin:0;font-size:20px">Track how good your predictions are</h2>
      <p>Start by creating a category — e.g. “Work”, “Sports”, “Politics”, “Personal”.</p>
      <button class="btn primary" data-act="new-cat">Create a category</button>
      ${helpHTML()}
    </div>`;
  }
  const m = metrics(state.predictions);
  const cats = state.categories.map(c => {
    const cm = metrics(predsIn(c.id));
    return `<a class="card cat-card" href="#/c/${encodeURIComponent(c.id)}" style="--cat:${c.color}">
      <div class="row1"><h3>${esc(c.name)}</h3><div class="counts">${cm.total} total · ${cm.open} open</div></div>
      <div class="mini">
        <span>Accuracy <b>${fmtPct(cm.accuracy)}</b></span>
        <span>Specificity <b>${fmtPct(cm.specificity)}</b></span>
        <span>Bias <b>${fmtBias(cm.bias)}</b></span>
      </div>
    </a>`;
  }).join('');
  const due = state.predictions.filter(p => isOpen(p) && p.dueDate && p.dueDate <= todayISO()).length;
  return `
    ${due ? `<div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:10px"><span class="pill warn">${due} due</span><span class="muted" style="font-size:14px">prediction${due > 1 ? 's are' : ' is'} past the resolve date — open the category to mark ${due > 1 ? 'them' : 'it'}.</span></div>` : ''}
    <div class="section-title" style="margin-top:4px"><h2>Overall</h2></div>
    ${statsHTML(m)}
    <div class="section-title"><h2>Categories</h2><button class="btn small" data-act="new-cat">+ Category</button></div>
    <div class="cat-list">${cats}</div>
    ${state.predictions.length ? `<div class="section-title"><h2>Trends — all categories</h2>${windowSeg()}</div>${chartsHTML(state.predictions)}` : ''}
    ${helpHTML()}
  `;
}

function windowSeg() {
  return `<div class="seg" role="group" aria-label="Averaging window">
    <button data-act="window" data-v="cum" class="${ui.window === 'cum' ? 'on' : ''}">All-time</button>
    <button data-act="window" data-v="10" class="${ui.window == 10 ? 'on' : ''}">Last 10</button>
  </div>`;
}

function chartsHTML(preds) {
  const s = series(preds, ui.window === 'cum' ? 'cum' : Number(ui.window));
  const how = ui.window === 'cum' ? 'Running average' : 'Rolling average of last 10';
  return `<div class="charts">
    <div class="card chart-card"><h4>Specificity</h4><div class="desc">${how}, by date made</div>${lineChart(s.spec, { min: 0, max: 100, fmt: fmtPct, color: 'var(--accent)' })}</div>
    <div class="card chart-card"><h4>Bias</h4><div class="desc">${how}, by date resolved · above 0 = overconfident</div>${lineChart(s.bias, { zero: true, fmt: v => (v > 0 ? '+' : '') + Math.round(v), color: 'var(--bad)' })}</div>
    <div class="card chart-card"><h4>Accuracy</h4><div class="desc">${how}, by date resolved</div>${lineChart(s.acc, { min: 0, max: 100, fmt: fmtPct, color: 'var(--good)' })}</div>
    <div class="card chart-card"><h4>Calibration</h4><div class="desc">Grouped by how confident you were</div>${calibrationHTML(preds)}</div>
  </div>`;
}

function predHTML(p, showCat) {
  const c = catById(p.categoryId);
  const today = todayISO();
  let status = '';
  if (p.outcome === 'true' || p.outcome === 'false') {
    const hit = p.confidence === 50 ? null : (p.confidence > 50) === (p.outcome === 'true');
    status = `<span class="pill ${hit == null ? '' : hit ? 'good' : 'bad'}">${p.outcome === 'true' ? 'Happened' : 'Didn’t happen'}${hit == null ? '' : hit ? ' ✓' : ' ✗'}</span>`;
  } else if (p.outcome === 'void') {
    status = '<span class="pill">Void</span>';
  } else if (p.dueDate && p.dueDate <= today) {
    status = '<span class="pill warn">Due</span>';
  }
  return `<div class="card pred" data-id="${p.id}">
    <div class="ptext" data-act="edit-pred" data-id="${p.id}">${esc(p.text)}</div>
    <div class="meta">
      <span class="pill" title="Your stated probability that this happens">${p.confidence}% · ${confWord(p.confidence)}</span>
      ${status}
      ${showCat && c ? `<span class="pill" style="--cat:${c.color}"><span class="dot"></span>${esc(c.name)}</span>` : ''}
      <span>Made ${fmtDate(p.createdAt)}</span>
      ${p.dueDate && isOpen(p) ? `<span>Resolves ${fmtDate(p.dueDate)}</span>` : ''}
      ${p.resolvedAt && !isOpen(p) ? `<span>Resolved ${fmtDate(p.resolvedAt)}</span>` : ''}
    </div>
    ${p.notes ? `<div class="muted" style="font-size:14px;margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(p.notes)}</div>` : ''}
    ${isOpen(p) ? `<div class="actions">
      <button class="btn small good" data-act="resolve" data-id="${p.id}" data-v="true">✓ Happened</button>
      <button class="btn small bad" data-act="resolve" data-id="${p.id}" data-v="false">✗ Didn’t</button>
    </div>` : ''}
  </div>`;
}

function categoryHTML(c) {
  const preds = predsIn(c.id);
  const m = metrics(preds);
  const f = ui.filter;
  const list = preds
    .filter(p => f === 'all' || (f === 'open' ? isOpen(p) : !isOpen(p)))
    .sort((a, b) => {
      if (f === 'open') {
        // Soonest due first, undated last, then newest.
        const da = a.dueDate || '9999', db = b.dueDate || '9999';
        return da.localeCompare(db) || b.createdAt.localeCompare(a.createdAt);
      }
      const ka = a.resolvedAt || a.createdAt, kb = b.resolvedAt || b.createdAt;
      return kb.localeCompare(ka) || b.ts - a.ts;
    });
  const counts = { open: m.open, resolved: preds.length - m.open, all: preds.length };
  return `
    ${statsHTML(m)}
    <div class="section-title"><h2>Predictions</h2>
      <div class="seg" role="group" aria-label="Filter">
        ${['open', 'resolved', 'all'].map(k => `<button data-act="filter" data-v="${k}" class="${f === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)} ${counts[k]}</button>`).join('')}
      </div>
    </div>
    <div class="pred-list">
      ${list.length ? list.map(p => predHTML(p, false)).join('') :
        `<div class="card empty"><p>${preds.length ? 'Nothing here.' : 'No predictions in this category yet.'}</p>${preds.length ? '' : '<button class="btn primary" data-act="new-pred">Add a prediction</button>'}</div>`}
    </div>
    ${preds.length ? `<div class="section-title"><h2>Trends</h2>${windowSeg()}</div>${chartsHTML(preds)}` : ''}
  `;
}

function helpHTML() {
  return `<details class="help card" style="margin-top:20px"><summary>How the numbers work</summary><div><dl>
    <dt>Confidence</dt><dd>For each prediction you give the probability (1–99%) that it comes true. 30% means you lean “no”.</dd>
    <dt>Specificity</dt><dd>How decisive the prediction is: distance from a coin flip. 50% → 0% specificity, 75% or 25% → 50%, 99% or 1% → 98%. Vague hedging lowers it; bold calls raise it.</dd>
    <dt>Accuracy</dt><dd>Of the resolved predictions where you leaned one way, the share that went that way.</dd>
    <dt>Bias</dt><dd>Average confidence in the side you picked minus how often that side was right. +10 pts means you're 10 points more sure than you should be (overconfident); negative means underconfident. Near 0 = well calibrated.</dd>
    <dt>Brier score</dt><dd>Mean of (probability − outcome)². 0 is perfect; 0.25 is what always saying 50% gets you. Lower is better.</dd>
    <dt>Void</dt><dd>Mark a prediction void if it can't be resolved fairly. It's excluded from every score.</dd>
    <dt>Your data</dt><dd>Everything is stored only in this browser's local storage. Use Menu → Export to back it up or move it to another device.</dd>
  </dl></div></details>`;
}

/* ---------- Dialogs ---------- */
const dlg = $('#dlg');
function openDialog(title, body, foot) {
  dlg.innerHTML = `<form method="dialog" id="dlg-form" novalidate>
    <div class="dlg-head"><h3>${title}</h3><button type="button" class="icon-btn" data-close aria-label="Close">${ICON.close}</button></div>
    <div class="dlg-body">${body}</div>
    <div class="dlg-foot">${foot}</div>
  </form>`;
  dlg.showModal();
  $('[data-close]', dlg).onclick = () => dlg.close();
  return $('#dlg-form', dlg);
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

function categoryDialog(cat) {
  let color = cat ? cat.color : COLORS[state.categories.length % COLORS.length];
  const n = cat ? predsIn(cat.id).length : 0;
  const form = openDialog(cat ? 'Edit category' : 'New category', `
    <label class="field">Name<input type="text" name="cname" required maxlength="60" value="${esc(cat?.name)}" placeholder="e.g. Work, Sports, Politics" autocomplete="off"></label>
    <div class="field" style="display:grid;gap:8px;font-size:14px;font-weight:600">Color<div class="swatches">${COLORS.map(c => `<button type="button" style="--sw:${c}" data-c="${c}" class="${c === color ? 'on' : ''}" aria-label="Color ${c}"></button>`).join('')}</div></div>
  `, `${cat ? '<button type="button" class="btn danger" data-del>Delete</button><span class="spacer"></span>' : ''}
      <button type="button" class="btn" data-close2>Cancel</button><button class="btn primary" value="ok">${cat ? 'Save' : 'Create'}</button>`);
  form.querySelectorAll('.swatches button').forEach(b => b.onclick = () => {
    color = b.dataset.c;
    form.querySelectorAll('.swatches button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('[data-close2]', form).onclick = () => dlg.close();
  const del = $('[data-del]', form);
  if (del) del.onclick = () => {
    if (!confirm(`Delete “${cat.name}”${n ? ` and its ${n} prediction${n > 1 ? 's' : ''}` : ''}? This can't be undone.`)) return;
    state.categories = state.categories.filter(c => c.id !== cat.id);
    state.predictions = state.predictions.filter(p => p.categoryId !== cat.id);
    save(); dlg.close(); location.hash = '#/'; render(null);
  };
  form.onsubmit = e => {
    e.preventDefault();
    const name = form.cname.value.trim();
    if (!name) { form.cname.focus(); return; }
    if (cat) { cat.name = name; cat.color = color; save(); dlg.close(); render(); }
    else {
      const c = { id: uid(), name, color, createdAt: todayISO() };
      state.categories.push(c); save(); dlg.close();
      location.hash = '#/c/' + encodeURIComponent(c.id);
    }
  };
  setTimeout(() => { if (!cat) form.cname.focus(); }, 50);
}

function predictionDialog(pred, defaultCat) {
  const p = pred || { confidence: 70, createdAt: todayISO(), categoryId: defaultCat || state.categories[0]?.id, outcome: null };
  let outcome = p.outcome || '';
  const form = openDialog(pred ? 'Edit prediction' : 'New prediction', `
    <label class="field">Prediction<span class="hint">Write it so it can be clearly judged true or false later.</span>
      <textarea name="text" required rows="2" maxlength="500" placeholder="e.g. The project ships before March 1">${esc(pred?.text)}</textarea></label>
    <label class="field">Category<select name="cat">${state.categories.map(c => `<option value="${c.id}" ${c.id === p.categoryId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
    <div class="field" style="display:grid;gap:6px;font-size:14px;font-weight:600">
      <div class="conf-display"><span>Chance it happens</span><span><span class="big" id="conf-v">${p.confidence}%</span></span></div>
      <input type="range" name="conf" min="1" max="99" step="1" value="${p.confidence}" aria-label="Confidence">
      <div class="conf-display"><span class="word" id="conf-w">${confWord(p.confidence)} · specificity ${Math.round(specOf(p))}%</span></div>
      <div class="quick">${[5, 10, 25, 40, 50, 60, 75, 90, 95].map(v => `<button type="button" data-q="${v}">${v}%</button>`).join('')}</div>
    </div>
    <div class="row2">
      <label class="field">Made on<input type="date" name="created" value="${p.createdAt}" required></label>
      <label class="field">Resolves by<input type="date" name="due" value="${p.dueDate || ''}"></label>
    </div>
    ${pred ? `<div class="field" style="display:grid;gap:6px;font-size:14px;font-weight:600">Outcome
      <div class="outcome-choice">${[['', 'Open'], ['true', 'Happened'], ['false', 'Didn’t'], ['void', 'Void']].map(([v, l]) => `<button type="button" data-o="${v}" class="${outcome === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <label class="field" id="resolved-wrap" ${outcome ? '' : 'hidden'}>Resolved on<input type="date" name="resolved" value="${p.resolvedAt || todayISO()}"></label>` : ''}
    <label class="field">Notes <span class="hint">Optional — reasoning, sources, resolution criteria.</span><textarea name="notes" rows="2" maxlength="2000">${esc(pred?.notes)}</textarea></label>
  `, `${pred ? '<button type="button" class="btn danger" data-del>Delete</button><span class="spacer"></span>' : ''}
      <button type="button" class="btn" data-close2>Cancel</button><button class="btn primary" value="ok">${pred ? 'Save' : 'Add'}</button>`);
  const setConf = v => {
    form.conf.value = v;
    $('#conf-v', form).textContent = v + '%';
    $('#conf-w', form).textContent = confWord(+v) + ' · specificity ' + Math.round(Math.abs(v - 50) * 2) + '%';
  };
  form.conf.oninput = () => setConf(form.conf.value);
  form.querySelectorAll('[data-q]').forEach(b => b.onclick = () => setConf(b.dataset.q));
  form.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    outcome = b.dataset.o;
    form.querySelectorAll('[data-o]').forEach(x => x.classList.toggle('on', x === b));
    $('#resolved-wrap', form).hidden = !outcome;
  });
  $('[data-close2]', form).onclick = () => dlg.close();
  const del = $('[data-del]', form);
  if (del) del.onclick = () => {
    const idx = state.predictions.indexOf(pred);
    state.predictions.splice(idx, 1); save(); dlg.close(); render();
    toast('Prediction deleted', () => { state.predictions.splice(idx, 0, pred); save(); render(); });
  };
  form.onsubmit = e => {
    e.preventDefault();
    const text = form.text.value.trim();
    if (!text) { form.text.focus(); return; }
    const created = form.created.value || todayISO();
    const target = pred || { id: uid(), ts: Date.now(), outcome: null };
    Object.assign(target, {
      text, categoryId: form.cat.value, confidence: +form.conf.value,
      createdAt: created, dueDate: form.due.value || null, notes: form.notes.value.trim(),
    });
    if (pred) {
      target.outcome = outcome || null;
      target.resolvedAt = outcome ? (form.resolved.value || todayISO()) : null;
    } else {
      state.predictions.push(target);
    }
    save(); dlg.close();
    if (!pred && currentCat && target.categoryId !== currentCat) location.hash = '#/c/' + encodeURIComponent(target.categoryId);
    else render();
  };
  setTimeout(() => { if (!pred) form.text.focus(); }, 50);
}

function menuDialog() {
  const bytes = new Blob([localStorage.getItem(KEY) || '']).size;
  const form = openDialog('Menu', `<div class="menu">
    <button type="button" class="btn" data-m="export">Export backup (JSON)</button>
    <button type="button" class="btn" data-m="import">Import backup…</button>
    <button type="button" class="btn danger" data-m="clear">Erase all data</button>
    <p class="muted" style="font-size:13px;margin:6px 2px 0">${state.categories.length} categories · ${state.predictions.length} predictions · ${(bytes / 1024).toFixed(1)} KB stored locally in this browser. Nothing is sent anywhere.</p>
  </div>`, '');
  form.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    if (m === 'export') {
      const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: `predictions-${todayISO()}.json` });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      dlg.close();
    } else if (m === 'import') {
      dlg.close(); $('#import-file').click();
    } else if (m === 'clear') {
      if (!confirm('Erase all categories and predictions from this browser? Export a backup first if you might want them.')) return;
      state = blank(); save(); dlg.close(); location.hash = '#/'; render(null);
    }
  });
}

$('#import-file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.categories) || !Array.isArray(data.predictions)) throw new Error('Not a prediction tracker backup.');
    const replace = !state.predictions.length && !state.categories.length ||
      confirm('Replace your current data with this backup?\n\nOK = replace everything\nCancel = merge (keep both)');
    if (replace) state = { version: 1, categories: data.categories, predictions: data.predictions };
    else {
      const haveC = new Set(state.categories.map(c => c.id)), haveP = new Set(state.predictions.map(p => p.id));
      state.categories.push(...data.categories.filter(c => !haveC.has(c.id)));
      state.predictions.push(...data.predictions.filter(p => !haveP.has(p.id)));
    }
    save(); location.hash = '#/'; render(null);
    toast(`Imported ${data.predictions.length} predictions`);
  } catch (err) { toast('Import failed: ' + err.message); }
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, undo) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 5000);
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('dialog')) return;
  const { act, id, v } = el.dataset;
  if (act === 'menu') menuDialog();
  else if (act === 'new-cat') categoryDialog(null);
  else if (act === 'edit-cat') categoryDialog(catById(id));
  else if (act === 'new-pred') predictionDialog(null, currentCat);
  else if (act === 'edit-pred') predictionDialog(state.predictions.find(p => p.id === id));
  else if (act === 'filter') { ui.filter = v; saveUI(); render(); }
  else if (act === 'window') { ui.window = v; saveUI(); render(); }
  else if (act === 'resolve') {
    const p = state.predictions.find(p => p.id === id);
    const prev = { outcome: p.outcome, resolvedAt: p.resolvedAt };
    p.outcome = v; p.resolvedAt = todayISO(); save(); render();
    const hit = p.confidence === 50 ? null : (p.confidence > 50) === (v === 'true');
    toast(hit == null ? 'Resolved' : hit ? 'Resolved — you called it ✓' : 'Resolved — missed this one', () => { Object.assign(p, prev); save(); render(); });
  }
});
$('#fab').addEventListener('click', () => state.categories.length ? predictionDialog(null, currentCat) : categoryDialog(null));
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if (e.key === KEY) { state = load(); route(); } });
route();
})();
</script>
</body>
</html>
